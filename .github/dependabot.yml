# Advisories in the locked tree are caught by `pnpm audit` in CI; this is the other half — the updates
# themselves, so the lockfile does not drift a year behind while the grant is being reviewed.
#
# Two deliberate choices:
#   - Updates are grouped and monthly. Twenty single-package pull requests a month would bury the
#     ones that are actual work, and every update here has to pass `pnpm verify` anyway.
#   - `@solana/*` and `@solana-program/*` are grouped together and never auto-mixed with the rest:
#     D1 requires exactly one version of each `@solana/*` package across the workspace, and these
#     packages move in lockstep. `pnpm check:solana-versions` fails a pull request that splits them.
#
# Most versions in this workspace live in `pnpm-workspace.yaml` under `catalog:` rather than in a
# package.json. If Dependabot cannot rewrite a catalog entry it will say so on the pull request; the
# update then has to be made by hand, which is the same amount of work as reading the release notes.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    # Written after the first run, which proposed both of the updates this project cannot take:
    #
    #   - Bumping the solana group (kit 8.0.0 -> 8.3.0 and the program packages) failed
    #     `pnpm fixtures:check`. That is D1 working: the committed fixture bytes are generated with the
    #     pinned versions, so these packages move only together AND only with a regenerated fixture
    #     set. That is a deliberate operation with a decision record, not a monthly chore.
    #   - Bumping `@types/node` to 26.x describes a runtime this project does not run on. Node is
    #     pinned to 24 by `.nvmrc`, and the token packages declare `engines.node >=24.0.0` (D1).
    #
    # Only *version* updates are ignored below. A security advisory against any of these still opens a
    # pull request, which is the half that must not be switched off.
    ignore:
      - dependency-name: '@solana/*'
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
      - dependency-name: '@solana-program/*'
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
      - dependency-name: '@types/node'
        update-types:
          - version-update:semver-major
    groups:
      solana:
        patterns:
          - '@solana/*'
          - '@solana-program/*'
      everything-else:
        patterns:
          - '*'
        exclude-patterns:
          - '@solana/*'
          - '@solana-program/*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - '*'
