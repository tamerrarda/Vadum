packages:
  - packages/*
  - apps/*
  - tools/*

# Every version the workspace depends on, in one place.
#
# The @solana/* and @solana-program/* entries move together and only together, and only with a
# regenerated fixture set (plan/01-DECISIONS.md D1, plan/24-SPEC-fixtures.md). @solana/sysvars is
# pinned explicitly because @solana-program/token-2022 peer-depends on it, and a default install
# otherwise resolves a second version beside kit's own. `pnpm check:solana-versions` enforces it.
catalog:
  "@solana/kit": 8.3.0
  "@solana/sysvars": 8.3.0
  "@solana-program/system": 0.14.1
  "@solana-program/token": 0.16.1
  "@solana-program/token-2022": 0.16.1
  "@solana/webcrypto-ed25519-polyfill": 8.3.0
  # The QR versions recorded in the fixtures are this encoder's output.
  qrcode: 1.5.4
  zxing-wasm: 3.1.3
  "@types/qrcode": 1.5.6
  "@types/node": ^24.0.0
  typescript: 7.0.2
  vitest: 5.0.0
  vite: 8.3.0
