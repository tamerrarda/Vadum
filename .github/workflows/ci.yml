name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Fixtures reproduce byte-for-byte from the committed seeds (24-SPEC)
        run: pnpm fixtures:check
      - name: One version of every @solana/* package (D1)
        run: pnpm check:solana-versions
      - name: packages/fixtures depends on no @vadum/* package (D33)
        run: pnpm check:fixtures-deps
      - name: No stream imports the fixture generator's reference modules (D33)
        run: pnpm check:reference-imports
      - name: Test-key warning present in the fixture seeds (24-SPEC)
        run: pnpm check:test-keys
      - name: core source-size budget (20-ARCHITECTURE)
        run: pnpm check:core-size
      # Gate G1 (plan/50-INTEGRATION.md, D34) used to run in a job gated on a pull request from
      # `stream/core`. That branch merged and will not exist again, so the check ran nowhere. It now
      # runs on every push, which is what the gate was for.
      - name: No stub bodies left in packages/core/src (gate G1, D34)
        run: pnpm check:no-stubs
      # Neither app was built in CI, so a broken Vite build — or a scanner .wasm that stops landing in
      # precache-manifest.json — passed silently. That manifest is what makes D10's "same-origin and
      # precached" true, and scripts/build-precache.mjs fails the build when the .wasm or index.html is
      # missing from it.
      - name: Both PWAs build, and the scanner .wasm lands in the precache manifest (C1, D10)
        run: pnpm build
